<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Rock base gradient (darker fractured slate) -->
    <linearGradient id="crackedRockBase" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#697287"/>
      <stop offset="30%" stop-color="#464d5e"/>
      <stop offset="65%" stop-color="#2c313d"/>
      <stop offset="100%" stop-color="#14161e"/>
    </linearGradient>

    <!-- Glowing amber/golden stress core in the fault -->
    <linearGradient id="faultGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Highlight bevel -->
    <linearGradient id="chiseledHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4daf0" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#9ca7c4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3c4254" stop-opacity="0"/>
    </linearGradient>

    <!-- Deep shadow -->
    <linearGradient id="chiseledShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="60%" stop-color="#14161f" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#07080c" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Base Rock Shape -->
  <rect x="3" y="3" width="122" height="122" rx="18" fill="url(#crackedRockBase)"/>

  <!-- Bevel Chamfers -->
  <path d="M 3 20 L 20 3 L 108 3 L 94 17 L 33 17 L 17 33 L 3 20 Z" fill="url(#chiseledHighlight)"/>
  <path d="M 3 20 L 17 33 L 17 95 L 3 108 Z" fill="#69738c" fill-opacity="0.4"/>
  <path d="M 3 108 L 17 95 L 95 95 L 109 109 L 125 108 L 108 125 L 20 125 L 3 108 Z" fill="url(#chiseledShadow)"/>
  <path d="M 125 20 L 111 33 L 111 95 L 125 108 Z" fill="#090a0f" fill-opacity="0.8"/>

  <!-- Fractured Rock Planes -->
  <polygon points="17,33 46,20 40,58 17,52" fill="#7a8399" fill-opacity="0.45"/>
  <polygon points="58,18 111,33 82,54 52,48" fill="#586073" fill-opacity="0.4"/>
  <polygon points="76,68 111,95 68,108 54,82" fill="#1b1e27" fill-opacity="0.7"/>

  <!-- Chipped / Broken Impact Crater in the Center -->
  <polygon points="48,46 72,42 84,66 64,78 42,68" fill="#11131a" opacity="0.9"/>
  <polygon points="50,48 70,44 80,64 62,74 44,66" fill="#1e222d" opacity="0.7"/>

  <!-- Tectonic Fissure Glow Behind Main Cracks -->
  <path d="M 14 26 L 36 44 L 54 48 L 74 64 L 66 86 L 94 112" stroke="url(#faultGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <path d="M 54 48 L 88 34 L 114 42" stroke="url(#faultGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <path d="M 66 86 L 34 98 L 18 114" stroke="url(#faultGlow)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>

  <!-- Deep Black Fissure Trench (The Actual Crack) -->
  <path d="M 14 26 L 36 44 L 54 48 L 74 64 L 66 86 L 94 112" stroke="#08090d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 54 48 L 88 34 L 114 42" stroke="#08090d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 66 86 L 34 98 L 18 114" stroke="#08090d" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Bright Specular Highlight along Fissure Edges (Chipped Rim Reflection) -->
  <path d="M 15 24 L 37 42 L 55 46 L 75 62 L 67 84 L 95 110" stroke="#fffbeb" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <path d="M 55 46 L 89 32 L 115 40" stroke="#fef3c7" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <path d="M 67 84 L 35 96 L 19 112" stroke="#fef3c7" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>

  <!-- Branching Stress Micro-Cracks -->
  <path d="M 36 44 L 28 62 L 34 76" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 74 64 L 96 72 L 108 66" stroke="#fbbf24" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 74 64 L 82 86 L 80 102" stroke="#090a0f" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 75 65 L 83 87 L 81 103" stroke="#fef08a" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Stone Debris & Crumble Bits -->
  <polygon points="56,58 60,55 58,62" fill="#fef08a" opacity="0.9"/>
  <polygon points="68,72 73,70 70,76" fill="#cbd5e1" opacity="0.9"/>
  <polygon points="42,52 46,50 43,55" fill="#fcd34d" opacity="0.85"/>
  <circle cx="86" cy="48" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="28" cy="38" r="1.3" fill="#fef08a" opacity="0.8"/>
  <circle cx="62" cy="94" r="1.4" fill="#ffffff" opacity="0.75"/>
</svg>
